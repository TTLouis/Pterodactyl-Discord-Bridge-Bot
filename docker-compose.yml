# Pin BRIDGE_VERSION in .env to a published release (for example 0.3.0-beta.1).
# Use docker compose -f docker-compose.yml ... to avoid local legacy overrides.
services:
  discord-bot:
    image: ghcr.io/ttlouis/pterodactyl-discord-bridge-bot:${BRIDGE_VERSION:?Set BRIDGE_VERSION to a published release tag}
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      CONFIG_PATH: /config/servers.json
      STATE_PATH: /data/runtime-state.json
      PERSISTENT_CONFIG_PATH: /data/persistent-config.json
      PERSISTENT_SECRETS_PATH: /data/persistent-secrets.json
      KOOK_STATE_PATH: /data/kook-runtime-state.json
      HEARTBEAT_PATH: /data/heartbeat
      SYNC_HEALTH_PATH: /data/sync-health.json
    volumes:
      - bot_data:/data
    mem_limit: 256m
    cpus: "0.50"
    pids_limit: 128
    healthcheck:
      test: ["CMD", "node", "src/healthcheck.js"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    stop_grace_period: 30s
volumes:
  bot_data:
