name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64, DiscordBot]

    steps:
      - name: Deploy Discord bot
        run: |
          cd /opt/DiscordBot
          git pull --ff-only
          docker compose up -d --build
          docker image prune -f
