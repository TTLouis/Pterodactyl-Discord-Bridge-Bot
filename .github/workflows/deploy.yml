name: Deploy

on:
  push:
    branches:
      - testing

permissions:
  contents: read

concurrency:
  group: testing-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64, DiscordBot]
    timeout-minutes: 15

    steps:
      - name: Deploy Discord bot
        run: |
          cd /opt/DiscordBot
          git fetch --prune origin testing
          git switch -C testing origin/testing
          docker compose up -d --build
          docker image prune -f
