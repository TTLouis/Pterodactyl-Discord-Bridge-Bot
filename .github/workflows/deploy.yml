name: CI and Deploy

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-and-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, DiscordBot]
    timeout-minutes: 15

    steps:
      - name: Deploy Discord bot
        run: |
          cd /opt/docker/discord-bot
          previous_commit=$(git rev-parse HEAD)
          git fetch --prune origin main
          git reset --hard origin/main
          docker compose up -d --build --remove-orphans
          for attempt in $(seq 1 36); do
            if docker compose exec -T discord-bot node src/healthcheck.js; then
              docker image prune -f
              exit 0
            fi
            sleep 5
          done
          echo "Deployment did not become healthy; restoring ${previous_commit}."
          git reset --hard "$previous_commit"
          docker compose up -d --build --remove-orphans
          exit 1
