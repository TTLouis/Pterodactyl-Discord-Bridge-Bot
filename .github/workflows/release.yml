name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Check tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node --input-type=module -e 'import fs from "node:fs"; const p=JSON.parse(fs.readFileSync("package.json")); if(process.env.RELEASE_TAG !== `v${p.version}` || !fs.existsSync(`docs/releases/${p.version}.md`)) process.exit(1);'
      - run: npm ci
      - run: npm test
      - name: Validate public Compose
        run: |
          cp .env.example .env
          BRIDGE_VERSION=ci docker compose -f docker-compose.yml config --quiet
      - name: Build and rehearse Egg image
        run: |
          docker build -t bridge:release-check .
          bash scripts/egg-image-smoke.sh bridge:release-check
  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            architecture: amd64
          - runner: ubuntu-24.04-arm
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Build and push native image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          ARCHITECTURE: ${{ matrix.architecture }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          image="ghcr.io/${REPOSITORY,,}"
          version="${RELEASE_TAG#v}"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io' EXIT
          docker build --platform "linux/$ARCHITECTURE" \
            --build-arg "BRIDGE_REVISION=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=https://github.com/$REPOSITORY" \
            --label "org.opencontainers.image.version=$version" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t "$image:$version-$ARCHITECTURE" .
          bash scripts/egg-image-smoke.sh "$image:$version-$ARCHITECTURE"
          docker push "$image:$version-$ARCHITECTURE"
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish multi-platform image and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          image="ghcr.io/${REPOSITORY,,}"
          version="${RELEASE_TAG#v}"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io' EXIT
          docker buildx imagetools create --tag "$image:$version" \
            "$image:$version-amd64" "$image:$version-arm64"
          docker buildx imagetools inspect "$image:$version" --format '{{json .Manifest}}' > /tmp/manifest.json
          digest=$(python3 -c 'import json; print(json.load(open("/tmp/manifest.json"))["digest"])')
          cp "docs/releases/$version.md" /tmp/release-notes.md
          printf '\nContainer: `%s:%s`\n\nImage digest: `%s`\n' "$image" "$version" "$digest" >> /tmp/release-notes.md
          prerelease=()
          if [[ "$RELEASE_TAG" == *-* ]]; then prerelease+=(--prerelease); fi
          gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --notes-file /tmp/release-notes.md "${prerelease[@]}" deployment/egg-pterodactyl-platform-bridge.json docker-compose.yml .env.example
