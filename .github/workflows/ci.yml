name: Public CI
on:
  pull_request:
  push:
    branches: [main, master, testing]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Validate public Compose
        run: |
          cp .env.example .env
          BRIDGE_VERSION=ci docker compose -f docker-compose.yml config --quiet
      - name: Build release image
        run: docker build -t bridge:ci .
      - name: Rehearse isolated install, restart and storage recovery
        run: |
          bridge_volume="bridge-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker volume create "$bridge_volume"
          trap 'docker volume rm "$bridge_volume"' EXIT
          for bridge_phase in fresh restart recovery; do
            docker run --rm -i --network none \
              -e DISCORD_TOKEN=smoke-token -e "SMOKE_PHASE=$bridge_phase" \
              -v "$bridge_volume:/data" bridge:ci node --input-type=module < scripts/beta-image-smoke.js
          done
      - name: Rehearse isolated Pterodactyl storage and runtime
        run: bash scripts/egg-image-smoke.sh bridge:ci
